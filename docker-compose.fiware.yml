# FIWARE Orion-LD Context Broker Stack
# Deploys: Orion-LD + MongoDB + JSON-LD Context Service
#
# Usage:
#   docker compose -f docker-compose.fiware.yml up -d
#   docker compose -f docker-compose.fiware.yml ps
#   docker compose -f docker-compose.fiware.yml logs -f orion-ld
#
# Health Checks:
#   curl http://localhost:1026/health
#   curl http://localhost:27017
#   curl http://localhost:3000/health
#
# Versions (every image is pinned by immutable digest, Issue #204 / ADR-0017):
#   - Orion-LD: 1.5.0 (NGSI-LD v1.3.1 compliant)
#       quay.io/fiware/orion-ld:1.5.0
#       sha256:dcb8c4100769b2a873b6d16c8ed501515fe3fb9ebde8d0fb4c3129ef07671bd2
#   - MongoDB: 7.0 (LTS)
#       mongo:7.0
#       sha256:c53852c00c23ca9f23fc39690350ffa9a80e3642fe8f96879726d8da0abe80a7
#   - JSON-LD Context: nginx:alpine serving static contexts
#       nginx:alpine
#       sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
#
# Digests resolved from the registry manifest API (Docker Hub / Quay) and
# cross-checked by hashing the returned manifest body. The human-readable tag
# is kept next to each digest as a comment so the intended version stays
# visible in review.

services:
  mongodb:
    # mongo:7.0
    image: mongo@sha256:c53852c00c23ca9f23fc39690350ffa9a80e3642fe8f96879726d8da0abe80a7
    container_name: fiware-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-orion}
    env_file:
      - fiware/mongodb.env
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fiware-net

  orion-ld:
    # quay.io/fiware/orion-ld:1.5.0
    image: quay.io/fiware/orion-ld@sha256:dcb8c4100769b2a873b6d16c8ed501515fe3fb9ebde8d0fb4c3129ef07671bd2
    container_name: fiware-orion-ld
    restart: unless-stopped
    ports:
      - "${ORION_LD_PORT:-1026}:1026"
    volumes:
      - orionld-log:/var/log/orion-ld
    environment:
      ORION_LD_HOST: 0.0.0.0
      ORION_LD_PORT: 1026
      ORION_LD_MONGO_HOST: mongodb
      ORION_LD_MONGO_DB: ${MONGODB_DB:-orion}
      ORION_LD_LOG_LEVEL: ${ORION_LD_LOG_LEVEL:-info}
      # NGSI-LD v1.3.1 configuration
      ORION_LD_USE_NGSI_LD_API: "true"
      ORION_LD_INFORMATION_MODEL: "ngsi-ld"
      # CORS and API settings
      ORION_LD_CORS_ORIGINS: "${ORION_LD_CORS_ORIGINS:-*}"
      # Performance tuning
      ORION_LD_MAX_LIFETIME: 0
      ORION_LD_ENTITY_ID_REGEX: ".*"
    env_file:
      - fiware/orion-ld.env
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:1026/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fiware-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # JSON-LD Context Service for Smart Factory entities
  # Serves custom @context definitions for factory entities
  json-ld-context:
    # nginx:alpine
    image: nginx@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
    container_name: fiware-json-ld-context
    restart: unless-stopped
    ports:
      - "${JSON_LD_PORT:-3000}:80"
    volumes:
      - ./fiware/contexts:/usr/share/nginx/html:ro
    environment:
      NGINX_HOST: localhost
      NGINX_PORT: 80
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - fiware-net

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  orionld-log:
    driver: local

networks:
  fiware-net:
    driver: bridge
    name: fiware-net
