# ==============================================================================
# Routing truth table (path → workflow):
#   adr/**, docs/**, .github/workflows/**          → adr-lint.yml
#   dashboard/**, .github/workflows/dashboard-ci.yml → dashboard-ci.yml (this file)
#   esp32-ukit-bridge/**                          → bridge-ci.yml
#   factory-control/**                            → factory-control-ci.yml
#   iot-gateway/**                                → gateway-ci.yml
# ==============================================================================

name: Dashboard CI

on:
  push:
    branches:
      - master
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-ci.yml'

permissions:
  contents: read

jobs:
  dashboard-build-and-test:
    name: Dashboard Quality & Build Gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest test suite
        run: npm run test

      - name: Production Vite build
        run: npm run build
