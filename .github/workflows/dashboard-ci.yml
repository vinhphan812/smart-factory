# ==============================================================================
# Routing truth table (path -> workflow):
#   adr/**, docs/**, .github/workflows/**          -> adr-lint.yml
#   dashboard/**, .github/workflows/dashboard-ci.yml -> dashboard-ci.yml (this file)
#   esp32-ukit-bridge/**                          -> bridge-ci.yml
#   factory-control/**                            -> factory-control-ci.yml
#   iot-gateway/**                                -> gateway-ci.yml
#
# Canonical ownership:
#   This workflow file is the single canonical implementation of the Dashboard
#   quality gate for the repository. PR #259 (issue #156) owns the gate; PR
#   #260 (issue #149) carries a byte-identical copy of this file so the two
#   open branches do not shadow each other and merge without an add/add
#   conflict. Any change to the gate must be applied to both branches.
#
#   The `release-evidence` job added by PR #260 is a *separate, non-competing*
#   job. It does not rename, replace or relax the canonical
#   `Dashboard Quality & Build Gate` check, which remains owned by PR #259.
#   Because the two branches both add this file, the merge owner must apply
#   the same `release-evidence` job to PR #259's branch (or resolve the
#   add/add conflict in favour of the superset) — see the PR #260 body.
#
# Node version: eslint@10 requires node ^20.19.0 || ^22.13.0 || >=24;
# npm lockfileVersion 3 requires npm 7+ (bundled with node 20+).
# Node 22 is therefore the lowest-common-denominator major that satisfies
# every dependency engine constraint declared in dashboard/package-lock.json.
#
# Supply-chain scope: the gate records (a) a dependency advisory assessment,
# (b) an SBOM of the installed dependency tree, and (c) a retained build
# artifact together with its SHA-256 digest. These steps are deliberately
# non-blocking because the current lockfile still carries transitive
# advisories in the vitest/tinypool dev chain, and `npm audit fix --force`
# would apply a breaking major upgrade. The recorded evidence is review
# material for release acceptance; it is not a claim of a clean audit.
#
#   The separate `release-evidence` job is the exception: it *is* blocking.
#   It archives the raw npm audit reports, the production and development
#   SBOMs and a SHA256 manifest for the exact commit being built, and it
#   fails the job on any high or critical advisory or on any manifest
#   production/verification failure. It is not skippable and is not
#   `continue-on-error`.
# ==============================================================================

name: Dashboard CI

on:
  push:
    branches:
      - master
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-ci.yml'

permissions:
  contents: read

jobs:
  dashboard-build-and-test:
    name: Dashboard Quality & Build Gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency advisory assessment (non-blocking evidence)
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --audit-level=critical > npm-audit-summary.txt 2>&1 || true
          echo "--- critical advisory summary ---"
          cat npm-audit-summary.txt

      - name: Generate SBOM for the installed dependency tree (non-blocking evidence)
        run: |
          npm sbom --sbom-format=cyclonedx > sbom.cdx.json 2>/dev/null \
            || echo '{"note":"npm sbom unavailable in this npm version"}' > sbom.cdx.json
          head -c 200 sbom.cdx.json; echo

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest test suite
        run: npm run test

      - name: Production build with per-file integrity manifest
        run: npm run build:integrity

      - name: Verify per-file integrity manifest
        run: |
          cd dist
          sha256sum -c SHA256SUMS | tee ../sha256sum-verification.txt

      - name: Package build artifact with digest
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf dashboard-dist.tar.gz -C dist .
          sha256sum dashboard-dist.tar.gz | tee dashboard-dist.tar.gz.sha256

      - name: Upload build artifact and release evidence
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist-${{ github.sha }}
          path: |
            dashboard/dashboard-dist.tar.gz
            dashboard/dashboard-dist.tar.gz.sha256
            dashboard/dist/SHA256SUMS
            dashboard/sha256sum-verification.txt
            dashboard/npm-audit.json
            dashboard/npm-audit-summary.txt
            dashboard/sbom.cdx.json
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Archived, SHA-bound release evidence for the exact commit being built.
  #
  # This job is deliberately SEPARATE from, and does not modify, the canonical
  # `Dashboard Quality & Build Gate` job above, which remains owned by PR #259.
  # It adds a distinct check name so neither check competes with the other.
  #
  # Unlike the advisory steps of the canonical gate, this job is BLOCKING:
  #   - it fails when either archived audit report contains a high or
  #     critical advisory;
  #   - it fails when the SHA256 manifest cannot be produced or verified.
  # There is no `continue-on-error` and no conditional skip on this job.
  #
  # Retention: this repository's Actions artefact retention is capped at 90
  # days (the repository maximum). The archived evidence therefore EXPIRES
  # and is not an immutable, permanently retained record. The manifest digest
  # and the commit SHA are additionally stated in the PR body so the claim
  # stays checkable after expiry. This is a known residual gap.
  # ---------------------------------------------------------------------------
  release-evidence:
    name: Release Evidence (Archived, SHA-Bound)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4
        with:
          # Pin the checkout to the exact SHA being built so the archive's
          # COMMIT can never disagree with the tree the artefacts came from.
          ref: ${{ github.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Produce archived release evidence (audit, SBOMs, SHA256 manifest)
        run: |
          node scripts/release-evidence-archive.mjs \
            --out-dir release-evidence-archive \
            --commit "${{ github.sha }}"

      - name: Verify archived SHA256 manifest
        run: node scripts/release-evidence-archive.mjs --out-dir release-evidence-archive --verify

      - name: Upload archived release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: dashboard/release-evidence-archive
          retention-days: 90
          if-no-files-found: error

      - name: Advisory gate (fails the job on any high or critical advisory)
        run: node scripts/release-evidence-archive.mjs --out-dir release-evidence-archive --gate
