name: E2E Simulation & Backup-Restore Drill

on:
  push:
    branches:
      - feat/issue-182-deployment-e2e
      - fix/pr-244-remediation
      - master
  pull_request:
    branches:
      - master

jobs:
  e2e-simulation:
    name: E2E Simulation & Backup-Restore Drill (L2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Docker Compose
        run: docker compose version

      - name: Run E2E Simulation Stack & Smoke Tests
        run: |
          docker compose -f e2e/simulation/docker-compose.e2e.yml up --build --exit-code-from smoke-tests smoke-tests

      - name: Run Backup-Restore Drill
        run: |
          docker compose -f e2e/simulation/docker-compose.e2e.yml up --build --exit-code-from backup-restore-drill backup-restore-drill

      - name: Archive E2E JSON Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-simulation-report
          path: e2e/simulation/e2e-report.json

      - name: Teardown Compose Stack
        if: always()
        run: |
          docker compose -f e2e/simulation/docker-compose.e2e.yml down -v --remove-orphans
