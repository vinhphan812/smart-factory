name: ADR Lint & Architecture Governance Gate

on:
  push:
    branches:
      - master
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'smart-factory/**'
  pull_request:
    branches:
      - master

jobs:
  adr-lint:
    name: ADR Lint & Impact Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run ADR Linter & Governance Gate
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python scripts/check_adrs.py
          python -m pytest scripts/tests/test_check_adrs.py -v

  production-compose-gate:
    name: Production Compose Security Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      # Fails closed on permissive production defaults: wildcard Orion-LD
      # CORS, a defaulted SAFETY_OPERATOR_TOKEN, a default MQTT password, a
      # published plaintext broker port, and any production image that is not
      # pinned to an immutable OCI digest.
      - name: Run production compose security guard
        run: |
          python scripts/check_production_compose.py docker-compose.full.yml
          python -m pytest scripts/tests/test_check_production_compose.py -v
