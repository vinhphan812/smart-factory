# ==============================================================================
# Routing truth table (path → workflow):
#   adr/**, docs/**, .github/workflows/**          → adr-lint.yml  (this file)
#   dashboard/**, .github/workflows/dashboard-ci.yml → dashboard-ci.yml
#   esp32-ukit-bridge/**                          → bridge-ci.yml
#   factory-control/**                            → factory-control-ci.yml
#   iot-gateway/**                                → gateway-ci.yml
#
# Module ownership:
#   adr/                          : global governance (all modules)
#   docs/                         : global documentation
#   esp32-ukit-bridge/            : ESP32 ↔ MEGA-uKit firmware + AMLP bridge
#   factory-control/              : factory controller simulator + PLC adapter
#   iot-gateway/                 : MQTT broker + HTTP/WebSocket API server
# ==============================================================================

name: ADR Lint & Architecture Governance Gate

on:
  push:
    branches:
      - master
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'smart-factory/**'
  pull_request:
    branches:
      - master

jobs:
  adr-lint:
    name: ADR Lint & Impact Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest yamllint

      - name: YAML lint (workflow hygiene)
        run: yamllint .github/workflows/

      - name: Run ADR Linter & Governance Gate
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python scripts/check_adrs.py
          python -m pytest scripts/tests/test_check_adrs.py -v
