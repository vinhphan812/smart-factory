# ==============================================================================
# Routing truth table (path → workflow):
#   adr/**, docs/**, .github/workflows/**          → adr-lint.yml
#   edge-ai-robot/**, integration-tests/**         → edge-ai-ci.yml
#   esp32-ukit-bridge/**                          → bridge-ci.yml
#   factory-control/**                            → factory-control-ci.yml  (this file)
#   iot-gateway/**                                → gateway-ci.yml
#
# Module ownership:
#   edge-ai-robot/    : robot adapter + bounded skills + FIWARE response policy
#   factory-control/    : Factory controller simulator + PLC adapter
#   integration-tests/: cross-module scenario harness (L2 simulation)
# ==============================================================================

name: Factory Control Tests

on:
  push:
    branches:
      - master
      - "feat/**"
      - "fix/**"
    paths:
      - "factory-control/**"
  pull_request:
    paths:
      - "factory-control/**"

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest pytest-asyncio

      - name: Run tests
        run: |
          PYTHONPATH=factory-control/src pytest factory-control/tests/ -v --tb=short
