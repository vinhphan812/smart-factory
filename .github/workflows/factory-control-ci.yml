name: Factory Control Tests

# Routing truth table:
# | Trigger | Paths              | Runs? | Reason                         |
# |---------|--------------------|-------|--------------------------------|
# | push    | factory-control/** | ✓     | Factory control code changed   |
# | PR      | factory-control/** | ✓     | Factory control code under rev  |
# | any     | other/paths       | ✗     | Path filter excludes other dirs |

on:
  push:
    branches:
      - master
      - "feat/**"
      - "fix/**"
    paths:
      - "factory-control/**"
  pull_request:
    paths:
      - "factory-control/**"

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest pytest-asyncio

      - name: Run tests
        run: |
          PYTHONPATH=factory-control/src pytest factory-control/tests/ -v --tb=short
