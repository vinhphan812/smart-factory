name: Factory Control Tests

on:
  push:
    branches:
      - master
      - "feat/**"
      - "fix/**"
    paths:
      - "factory-control/**"
  pull_request:
    paths:
      - "factory-control/**"

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest pytest-asyncio

      - name: Run tests
        run: |
          PYTHONPATH=factory-control/src pytest factory-control/tests/ -v --tb=short
