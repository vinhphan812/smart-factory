# ==============================================================================
# Routing truth table (path → workflow):
#   adr/**, docs/**, .github/workflows/**          → adr-lint.yml
#   esp32-ukit-bridge/**                          → bridge-ci.yml
#   factory-control/**                            → factory-control-ci.yml
#   iot-gateway/**                                → gateway-ci.yml  (this file)
#
# Module ownership:
#   iot-gateway/      : MQTT broker + HTTP/WebSocket API server
# ==============================================================================

name: IoT Gateway Tests

on:
  push:
    branches:
      - master
    paths:
      - iot-gateway/**
  pull_request:
    paths:
      - iot-gateway/**

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e iot-gateway[dev]

      - name: Run tests
        run: |
          python -m pytest iot-gateway/tests/ -v --tb=short \
            --ignore=iot-gateway/tests/test_gateway.py \
            --ignore=iot-gateway/tests/test_ssrf.py \
            --ignore=iot-gateway/tests/test_time_sync.py \
            --ignore=iot-gateway/tests/test_orion_ld.py \
            --ignore=iot-gateway/tests/test_auth.py

      - name: Coverage
        run: |
          python -m pytest iot-gateway/tests/ --cov=iot_gateway \
            --cov-report=xml --cov-report=term-missing
        continue-on-error: true
