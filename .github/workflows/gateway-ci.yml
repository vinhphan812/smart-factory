name: IoT Gateway Tests

on:
  push:
    branches:
      - fix/p0-root-module-boundaries
      - master
    paths:
      - iot-gateway/**
  pull_request:
    paths:
      - iot-gateway/**

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e iot-gateway[dev]

      - name: Run tests
        run: python -m pytest iot-gateway/tests/ -v --tb=short

      - name: Coverage
        run: python -m pytest iot-gateway/tests/ --cov=iot_gateway --cov-report=xml --cov-report=term-missing
        continue-on-error: true
