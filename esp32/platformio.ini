[platformio]
default_envs = esp32-s3

[env]
monitor_speed = 115200

[env:esp32-s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  knolleary/PubSubClient@2.8
  bblanchon/ArduinoJson@7.4.3

[env:native]
platform = native
build_flags =
  -std=gnu++17
test_framework = unity
test_filter = test_bridge
build_src_filter = -<*>
lib_ldf_mode = deep+
