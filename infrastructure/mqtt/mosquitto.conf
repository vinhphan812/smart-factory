# Local development broker configuration.
#
# TLS policy: the tls.conf snippet is included only when TLS_MODE=yes (set
# automatically by the 'tls' compose profile). Without TLS_MODE the broker
# starts on plaintext 1883 only; it will NOT expose 8883.
#
# P2 FIX: TLS listener is no longer unconditionally declared.
# If certs are mounted but TLS_MODE is not set, mosquitto still refuses to
# start for the 8883 listener because the listener + cert lines only exist
# inside tls.conf which is not included. No silent plaintext fallback.
#
# Production brokers must use a managed secret store and a CA issued by the
# organization's PKI.
allow_anonymous false
password_file /mosquitto/passwords/passwd
acl_file /mosquitto/config/acl
listener 1883

# Conditional TLS — included only when TLS_MODE=yes (tls compose profile).
# Never include TLS config in a default/no-tls deployment.
include_dir /mosquitto/config/conf.d

persistence true
persistence_location /mosquitto/data/
log_dest stdout