# Local development broker configuration. Production brokers must use a
# managed secret store and a CA issued by the organization's PKI.
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl
listener 1883

# TLS listener is enabled when the deployment mounts all three files and uses
# the TLS compose profile. Never use development certificates in production.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
use_identity_as_username false

persistence true
persistence_location /mosquitto/data/
log_dest stdout
