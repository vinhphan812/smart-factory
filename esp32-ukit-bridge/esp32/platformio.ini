[platformio]
default_envs = esp32-s3

[env]
monitor_speed = 115200

[env:esp32-s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  knolleary/PubSubClient@2.8
  bblanchon/ArduinoJson@7.4.3

[env:native]
platform = native
build_flags =
  -std=gnu++17
  -DPLATFORMIO_NATIVE_TEST
  -I test/stubs
test_framework = unity
test_filter = test_bridge|test_telemetry
; Include only the specific sources needed for native test compilation.
; All other src/ files (main.cpp, mqtt_bridge.cpp, diagnostics.cpp, etc.)
; require Arduino/WiFi/ArduinoJson and must not be compiled in native tests.
build_src_filter =
  +<src/uart_adapter.cpp>
  +<lib/amlp/src/*.cpp>
  +<lib/bridge-core/src/*.cpp>
  +<test/*/*.cpp>
  -<*>
lib_ldf_mode = deep+
