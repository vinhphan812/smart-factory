[platformio]
default_envs = esp32-s3

[env]
monitor_speed = 115200

[env:esp32-s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  knolleary/PubSubClient@2.8
  bblanchon/ArduinoJson@7.4.3

[env:native]
platform = native
build_flags =
  -std=gnu++17
  -DPLATFORMIO_NATIVE_TEST
  -I test/stubs
build_src_filter = -<*>
lib_ldf_mode = deep+

[env:native_test]
platform = native
lib_deps =
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -std=gnu++17
  -DPLATFORMIO_NATIVE_TEST
  -I include
  -I lib/amlp/include
  -I lib/bridge-core/src
  -I lib/json-adapter/include
  -I test/stubs
  -I .pio/libdeps/native/ArduinoJson/src
test_framework = unity
test_filter = test_bridge|test_telemetry
; Production source files compiled via build_src_filter for the native_test build.
; Paths relative to the project root (esp32-ukit-bridge/esp32/).
build_src_filter =
  +<test/*/*.cpp>
  +<lib/amlp/src/amlp.cpp>
  +<lib/bridge-core/src/bridge_core.cpp>
  +<lib/bridge-core/src/command_mapper.cpp>
  +<lib/json-adapter/src/json_adapter.cpp>
  +<src/uart_adapter.cpp>
  +<src/mqtt_bridge.cpp>
  -<*>
