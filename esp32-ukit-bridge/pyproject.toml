[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-ukit-amlp-tools"
version = "0.1.0"
description = "AMLP command-line tools and uKit simulator for the ESP32-uKit bridge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ESP32-uKit Bridge contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
amlp = "amlp.cli:main"
amlp-sim = "amlp.simulator:main"

[tool.setuptools]
package-dir = { "" = "tools" }

[tool.setuptools.packages.find]
where = ["tools"]
include = ["amlp*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/python", "tests/parity"]
pythonpath = ["tools"]
