# docker-compose.full.yml
# Full-stack Smart Factory — all services except hardware-in-the-loop.
# No ESP32, no physical uKit motors. Mock MQTT publisher drives the simulation.
#
# Usage:
#   docker compose -f docker-compose.full.yml up -d
#   docker compose -f docker-compose.full.yml ps
#   docker compose -f docker-compose.full.yml logs -f iot-gateway
#
# Teardown:
#   docker compose -f docker-compose.full.yml down -v

services:
  # ── Infrastructure ────────────────────────────────────────────────────────

  mqtt:
    image: eclipse-mosquitto:2
    container_name: sf-mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - mqtt-data:/mosquitto/data
      - mqtt-conf:/mosquitto/config
      - ./infrastructure/mqtt-broker/entrypoint.d:/docker-entrypoint.d:ro
    environment:
      MQTT_ADMIN_USERNAME: "${MQTT_ADMIN_USERNAME:-admin}"
      MQTT_ADMIN_PASSWORD: "${MQTT_ADMIN_PASSWORD:-changeme}"
      MQTT_GW_USERNAME: "${MQTT_GW_USERNAME:-gateway}"
      MQTT_GW_PASSWORD: "${MQTT_GW_PASSWORD:-changeme}"
    env_file:
      - .env
    entrypoint: ["sh", "/docker-entrypoint.d/init.sh"]
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-t", "test", "-m", "ping", "-h", "localhost", "-p", "1883"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sf-net

  # ── FIWARE Context Broker ─────────────────────────────────────────────────

  mongodb:
    image: mongo:7.0
    container_name: sf-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    env_file:
      - ./fiware/mongodb.env
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sf-net

  orion-ld:
    image: quay.io/fiware/orion-ld:1.5.0
    container_name: sf-orion-ld
    restart: unless-stopped
    ports:
      - "${ORION_LD_PORT:-1026}:1026"
    environment:
      ORION_LD_HOST: 0.0.0.0
      ORION_LD_PORT: 1026
      ORION_LD_MONGO_HOST: mongodb
      ORION_LD_MONGO_DB: ${MONGODB_DB:-orion}
      ORION_LD_LOG_LEVEL: info
      ORION_LD_USE_NGSI_LD_API: "true"
      ORION_LD_INFORMATION_MODEL: ngsi-ld
      ORION_LD_CORS_ORIGINS: "*"
      ORION_LD_MAX_LIFETIME: 0
      ORION_LD_ENTITY_ID_REGEX: ".*"
    env_file:
      - ./fiware/orion-ld.env
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:1026/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sf-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  json-ld-context:
    image: nginx:alpine
    container_name: sf-json-ld-ctx
    restart: unless-stopped
    ports:
      - "${JSON_LD_PORT:-3000}:80"
    volumes:
      - ./fiware/contexts:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sf-net

  # ── Core Services ────────────────────────────────────────────────────────

  iot-gateway:
    image: python:3.12-slim
    container_name: sf-iot-gateway
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -e .[dev] && exec iot-gateway"
    ports:
      - "${GW_WS_PORT:-8000}:8000"
      - "${GW_HTTP_PORT:-8001}:8001"
    volumes:
      - ./iot-gateway:/app
      - gw-data:/app/data
    env_file:
      - .env
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      MQTT_USERNAME: "${MQTT_GW_USERNAME:-gateway}"
      MQTT_PASSWORD: "${MQTT_GW_PASSWORD:-changeme}"
      DATABASE_URL: "sqlite+aiosqlite:///data/gateway.db"
      WS_HOST: "0.0.0.0"
      WS_PORT: "8000"
      WS_HTTP_PORT: "8001"
      MAX_EVENTS: "${MAX_EVENTS:-10000}"
      SAFETY_OPERATOR_TOKEN: "${SAFETY_OPERATOR_TOKEN:-}"
    depends_on:
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sf-net

  factory-control:
    image: python:3.12-slim
    container_name: sf-factory-control
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -e . && uvicorn factory_control.api:app --host 0.0.0.0 --port 8001"
    ports:
      - "${FC_PORT:-8002}:8001"
    volumes:
      - ./factory-control:/app
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      MQTT_GATEWAY_URL: "http://iot-gateway:8001"
    depends_on:
      mqtt:
        condition: service_healthy
      iot-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sf-net

  edge-ai-robot:
    image: python:3.12-slim
    container_name: sf-edge-ai-robot
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -e . && uvicorn edge_ai_robot.api.app:app --host 0.0.0.0 --port 8002"
    ports:
      - "${ROBOT_PORT:-8003}:8002"
    volumes:
      - ./edge-ai-robot:/app
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      GATEWAY_URL: "http://iot-gateway:8001"
    depends_on:
      mqtt:
        condition: service_healthy
      iot-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sf-net

  # ── Dashboard ─────────────────────────────────────────────────────────────

  dashboard:
    image: node:20-alpine
    container_name: sf-dashboard
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "npm install --prefer-offline && npm run dev -- --host 0.0.0.0"
    ports:
      - "${DASH_PORT:-5173}:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    environment:
      VITE_GATEWAY_WS_URL: "ws://iot-gateway:8000/ws"
      VITE_GATEWAY_HTTP_URL: "http://iot-gateway:8001"
    depends_on:
      iot-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - sf-net

# ── Volumes & Networks ───────────────────────────────────────────────────

volumes:
  mqtt-data:
  mqtt-conf:
  mongodb-data:
  mongodb-config:
  gw-data:

networks:
  sf-net:
    driver: bridge
    name: sf-net
