# docker-compose.e2e.yml
# E2E simulation — full Smart Factory stack with mock MQTT devices.
# No physical hardware. Safe to run in CI and local development.
#
# Usage:
#   docker compose -f e2e/simulation/docker-compose.e2e.yml up -d
#   docker compose -f e2e/simulation/docker-compose.e2e.yml logs -f
#   docker compose -f e2e/simulation/docker-compose.e2e.yml down -v
#
# ── Image / probe pinning notes ──────────────────────────────────────────────
# Each of these broke the stack before it was fixed; all were reproduced with
# a real `docker compose up` run.
#
#   * mongo:4.4    Orion-LD 1.5.0 uses the deprecated MongoDB C++ *legacy*
#                  driver, which speaks the legacy OP_QUERY wire protocol.
#                  MongoDB 5.0 REMOVED the legacy opcodes, so with mongo:5.0
#                  the broker logs "Unsupported OP_QUERY command:
#                  listDatabases" followed by "mongo::MsgAssertionException"
#                  and never becomes ready; with mongo:7.0 it fails the same
#                  way. mongo:4.4 is the newest server that still answers the
#                  legacy driver and is the tested pairing.
#   * mongo:4.4    ships the legacy `mongo` shell; `mongosh` only exists from
#                  mongo:6.0 onwards, so the health probe must call `mongo`.
#   * mongodb      data volume must be created by a 4.x server. A volume
#                  previously initialised by 7.0 carries
#                  featureCompatibilityVersion 7.0 and makes 4.4 refuse to
#                  start ("Wrong mongod version"). Recreate the volume when
#                  downgrading.
#   * orion-ld     1.5.0 reads ORIONLD_MONGO_HOST / ORIONLD_MONGO_DB.
#                  ORION_LD_MONGO_HOST is silently ignored and the broker then
#                  tries to reach localhost:27017 inside its own container.
#   * orion-ld     GET /version answers HTTP 200. GET /health is NOT a
#                  registered Orion-LD service and answers HTTP 400
#                  ("service not found"), so it can never be a liveness probe.
#                  The probe must also use `curl -f`: without it curl exits 0
#                  on an HTTP 400, so the container is marked healthy while
#                  the broker is unusable.
#   * python:3.12-slim has neither curl nor wget. Every probe for a Python
#                  service uses the interpreter's own urllib instead.

services:
  # ── MQTT Broker ────────────────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2
    container_name: e2e-mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - e2e-mqtt-data:/mosquitto/data
      - e2e-mqtt-conf:/mosquitto/config
      - ../../infrastructure/mqtt-broker/entrypoint.d:/docker-entrypoint.d:ro
    environment:
      MQTT_ADMIN_USERNAME: "${MQTT_ADMIN_USERNAME:-admin}"
      MQTT_ADMIN_PASSWORD: "${MQTT_ADMIN_PASSWORD:-changeme}"
      MQTT_GW_USERNAME: "${MQTT_GW_USERNAME:-gateway}"
      MQTT_GW_PASSWORD: "${MQTT_GW_PASSWORD:-changeme}"
    entrypoint: ["sh", "/docker-entrypoint.d/init.sh"]
    healthcheck:
      # The broker runs with allow_anonymous false, so the probe must
      # authenticate. The admin credential has readwrite on smart-factory/#.
      test:
        - "CMD-SHELL"
        - >-
          mosquitto_pub -h localhost -p 1883
          -u "$$MQTT_ADMIN_USERNAME" -P "$$MQTT_ADMIN_PASSWORD"
          -t "smart-factory/healthcheck" -m "ping" -q 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - e2e-net

  # ── Mock MQTT Device Simulator ──────────────────────────────────────────
  mock-mqtt-publisher:
    build:
      context: .
      dockerfile: Dockerfile.mock-publisher
    container_name: e2e-mock-publisher
    restart: unless-stopped
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      # The mock publisher *originates* device traffic, so it needs a
      # readwrite credential. The gateway credential is read-only by design
      # (see infrastructure/mqtt-broker/entrypoint.d/init.sh ACL), so the
      # simulation uses the admin credential, which is documented as
      # testing/management only.
      MQTT_USERNAME: "${MQTT_ADMIN_USERNAME:-admin}"
      MQTT_PASSWORD: "${MQTT_ADMIN_PASSWORD:-changeme}"
      PUBLISH_INTERVAL_S: "${MOCK_PUBLISH_INTERVAL_S:-2}"
    depends_on:
      mqtt:
        condition: service_healthy
    networks:
      - e2e-net

  # ── FIWARE ──────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:4.4
    container_name: e2e-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - e2e-mongo-data:/data/db
    env_file:
      - path: ../../fiware/mongodb.env
        required: false
    healthcheck:
      # mongo:4.4 ships the legacy `mongo` shell (mongosh only exists from
      # mongo:6.0 onwards), so the probe must use `mongo`.
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - e2e-net

  orion-ld:
    image: quay.io/fiware/orion-ld:1.5.0
    container_name: e2e-orion-ld
    restart: unless-stopped
    ports:
      - "${ORION_LD_PORT:-1026}:1026"
    environment:
      ORION_LD_HOST: 0.0.0.0
      ORION_LD_PORT: 1026
      # Orion-LD 1.5.0 reads ORIONLD_MONGO_HOST / ORIONLD_MONGO_DB.
      # ORION_LD_MONGO_HOST is silently ignored and the broker then tries to
      # reach localhost:27017 inside its own container.
      ORIONLD_MONGO_HOST: mongodb
      ORIONLD_MONGO_DB: ${MONGODB_DB:-orion}
      ORION_LD_LOG_LEVEL: info
      ORION_LD_USE_NGSI_LD_API: "true"
      ORION_LD_INFORMATION_MODEL: ngsi-ld
      ORION_LD_CORS_ORIGINS: "*"
      ORION_LD_MAX_LIFETIME: 0
      ORION_LD_ENTITY_ID_REGEX: ".*"
    env_file:
      - path: ../../fiware/orion-ld.env
        required: false
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      # GET /version answers 200; GET /health answers 400 ("service not
      # found"). `curl -f` makes a non-2xx answer a probe failure.
      test: ["CMD", "curl", "-sf", "http://localhost:1026/version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - e2e-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Core: IoT Gateway ───────────────────────────────────────────────────
  iot-gateway:
    image: python:3.12-slim
    container_name: e2e-iot-gateway
    restart: unless-stopped
    working_dir: /app
# Build once, then run the gateway's actual orchestration process.
    command: >
      sh -c "pip install --no-cache-dir -e .[dev] && exec iot-gateway"
    ports:
      # Gateway WebSocket transport (WS_PORT)
      - "${GW_WS_PORT:-8000}:8000"
      # Gateway REST health/events API (WS_HTTP_PORT)
      - "${GW_HTTP_PORT:-8001}:8001"
    volumes:
      - ../../iot-gateway:/app
      - e2e-gw-data:/app/data
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      MQTT_USERNAME: "${MQTT_GW_USERNAME:-gateway}"
      MQTT_PASSWORD: "${MQTT_GW_PASSWORD:-changeme}"
      DATABASE_URL: "sqlite+aiosqlite:///data/gateway.db"
      WS_HOST: "0.0.0.0"
      WS_PORT: "8000"
      WS_HTTP_PORT: "8001"
      MAX_EVENTS: "10000"
      SAFETY_OPERATOR_TOKEN: "${SAFETY_OPERATOR_TOKEN:-}"
      DEPLOYMENT_PROFILE: "LOCAL_SIM"
    depends_on:
      mqtt:
        condition: service_healthy
    healthcheck:
      # python:3.12-slim has no curl binary — probe with urllib instead.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - e2e-net

  # ── Core: Factory Control ─────────────────────────────────────────────────
  factory-control:
    image: python:3.12-slim
    container_name: e2e-factory-control
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -e . &&
             uvicorn factory_control.api:app --host 0.0.0.0 --port 8002"
    ports:
      - "${FC_PORT:-8002}:8002"
    volumes:
      - ../../factory-control:/app
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      # The gateway REST API is served on WS_HTTP_PORT (8001), not the
      # WebSocket port (8000).
      MQTT_GATEWAY_URL: "http://iot-gateway:8001"
    depends_on:
      mqtt:
        condition: service_healthy
      iot-gateway:
        condition: service_healthy
    healthcheck:
      # python:3.12-slim has no curl binary — probe with urllib instead.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - e2e-net

  # ── Core: Edge AI Robot (Yanshee stand-in) ────────────────────────────────
  # Software stand-in for the Yanshee robot, used by the "Yanshee offline"
  # negative scenario (the container is stopped to simulate an unreachable
  # robot). L2 simulation only — never HIL evidence.
  edge-ai-robot:
    image: python:3.12-slim
    container_name: e2e-edge-ai-robot
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -e . &&
             uvicorn edge_ai_robot.api.app:app --host 0.0.0.0 --port 8002"
    ports:
      - "${ROBOT_PORT:-8003}:8002"
    volumes:
      - ../../edge-ai-robot:/app
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      GATEWAY_URL: "http://iot-gateway:8001"
    depends_on:
      mqtt:
        condition: service_healthy
      iot-gateway:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - e2e-net

  # ── Dashboard ────────────────────────────────────────────────────────────
  dashboard:
    image: node:20-alpine
    container_name: e2e-dashboard
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "npm install --prefer-offline &&
             npm run dev -- --host 0.0.0.0"
    ports:
      - "${DASH_PORT:-5173}:5173"
    volumes:
      - ../../dashboard:/app
      - /app/node_modules
    environment:
      VITE_GATEWAY_WS_URL: "ws://iot-gateway:8000/ws"
      VITE_GATEWAY_HTTP_URL: "http://iot-gateway:8001"
    depends_on:
      iot-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - e2e-net

  # ── Smoke Tests (runs once then exits) ───────────────────────────────────
  # Runs INSIDE the compose network, so it addresses the services by their
  # compose service names (iot-gateway, orion-ld, factory-control, mqtt).
  # The #180 negative-scenario suite (scenarios/) needs the host `docker
  # compose` CLI to inject faults, so it runs on the HOST instead — see
  # e2e/simulation/README.md and .github/workflows/e2e-simulation.yml.
  smoke-tests:
    image: python:3.12-slim
    container_name: e2e-smoke-tests
    working_dir: /tests
    command: >
      sh -c "pip install --no-cache-dir paho-mqtt websockets httpx pytest pytest-asyncio &&
             python -m pytest smoke_tests.py -v --tb=short"
    volumes:
      - .:/tests
      - ../../iot-gateway:/app/iot-gateway:ro
    environment:
      GW_WS_PORT: "${GW_WS_PORT:-8000}"
      GW_HTTP_PORT: "${GW_HTTP_PORT:-8001}"
      ORION_LD_PORT: "${ORION_LD_PORT:-1026}"
      FC_PORT: "8002"
      DASH_PORT: "${DASH_PORT:-5173}"
      MQTT_PORT: "${MQTT_PORT:-1883}"
      SMOKE_TEST_TIMEOUT_S: "${SMOKE_TEST_TIMEOUT_S:-60}"
    depends_on:
      iot-gateway:
        condition: service_healthy
      orion-ld:
        condition: service_healthy
      factory-control:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    networks:
      - e2e-net
    # Run smoke tests once and exit (do not restart)
    restart: "no"

  # ── Backup/Restore Drill (runs once then exits) ───────────────────────────
  # Exercises WAL-safe backup + atomic restore against the LIVE gateway
  # database (shared e2e-gw-data volume) while the gateway is running.
  # Evidence level: L2 simulation.
  backup-restore-drill:
    image: python:3.12-slim
    container_name: e2e-backup-restore-drill
    working_dir: /tests
    command: >
      sh -c "pip install --no-cache-dir pytest pytest-asyncio 'sqlalchemy[asyncio]' aiosqlite &&
             python -m pytest backup_restore_drill.py -v --tb=short"
    volumes:
      - .:/tests
      - ../../iot-gateway:/app/iot-gateway:ro
      - e2e-gw-data:/app/data
    environment:
      GATEWAY_DB_PATH: "/app/data/gateway.db"
      GW_HTTP_PORT: "${GW_HTTP_PORT:-8001}"
      DRILL_SCRATCH_DIR: "/tmp/backup-restore-drill"
    depends_on:
      iot-gateway:
        condition: service_healthy
    networks:
      - e2e-net
    restart: "no"

# ── Volumes & Networks ──────────────────────────────────────────────────

volumes:
  e2e-mqtt-data:
  e2e-mqtt-conf:
  e2e-mongo-data:
  e2e-gw-data:

networks:
  e2e-net:
    driver: bridge
    name: e2e-net
