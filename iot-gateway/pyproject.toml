[project]
name = "iot-gateway"
version = "0.1.0"
description = "MQTT ingestion gateway for Smart Factory ESP32-uKit Bridge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Smart Factory Team" }
]
keywords = ["mqtt", "gateway", "smart-factory", "esp32", "iot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "paho-mqtt>=2.0.0",
    "websockets>=12.0",
    "uvicorn[standard]>=0.25.0",
    "fastapi>=0.110.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19,<1.0",
    "greenlet>=3.0",
    "aiohttp>=3.9.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "aioresponses>=0.7",
]
test = ["iot-gateway[dev]"]

[project.scripts]
iot-gateway = "iot_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["iot_gateway"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
